name: Deploy to Container App

on:
    push:
        branches:
            - main
            - qa
            - develop
            - "feature/**"
            - "bugfix/**"
            - "hotfix/**"
    workflow_dispatch:

env:
    ACR_NAME: ${{ vars.ACR_NAME }}
    ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    IMAGE_REPO: todo-flask-api
    CONTAINERAPP_NAME: ${{ vars.CONTAINERAPP_NAME }}
    RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}

jobs:
    # Etapa 1 - Autenticacion y verificacion del ACR
    auth:
        name: Authenticate to ACR
        runs-on: ubuntu-latest
        environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'noprod' }}
        steps:
            - name: Azure Login
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set subscription
              run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

            - name: Verify ACR and login
              run: |
                  az acr show -n "${{ env.ACR_NAME }}" -o table
                  az acr login -n "${{ env.ACR_NAME }}"

    # Etapa 2 - Generar version dinamica
    versioning:
        name: Generate Version
        runs-on: ubuntu-latest
        needs: auth
        environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'noprod' }}
        outputs:
            IMAGE_TAG: ${{ steps.compute_version.outputs.IMAGE_TAG }}
        steps:
            - name: Azure Login
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Compute next version
              id: compute_version
              run: |
                  tags=$(az acr repository show-tags \
                    --name "${{ env.ACR_NAME }}" \
                    --repository "${{ env.IMAGE_REPO }}" \
                    --orderby time_desc \
                    --output tsv 2>/dev/null || echo "")

                  if [ -z "$tags" ]; then
                    latestTag="0.0.0"
                  else
                    latestTag=$(echo "$tags" | head -n 1)
                  fi

                  IFS='.' read -r major minor patch <<< "$latestTag"
                  if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
                    major=0; minor=0; patch=0
                  fi

                  BRANCH="${{ github.ref }}"
                  if [ "$BRANCH" = "refs/heads/main" ]; then
                    newVersion="$((major + 1)).0.0"
                  elif [ "$BRANCH" = "refs/heads/qa" ] || [ "$BRANCH" = "refs/heads/develop" ]; then
                    newVersion="$major.$((minor + 1)).0"
                  else
                    newVersion="$major.$minor.$((patch + 1))"
                  fi

                  echo "Nueva version: $newVersion"
                  echo "IMAGE_TAG=$newVersion" >> $GITHUB_OUTPUT

    # Etapa 3 - Build de la imagen Docker
    build:
        name: Build Docker Image
        runs-on: ubuntu-latest
        needs: versioning
        environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'noprod' }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Azure Login
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: ACR login
              run: az acr login --name "${{ env.ACR_NAME }}"

            - name: Docker build and push
              run: |
                  IMAGE_TAG="${{ needs.versioning.outputs.IMAGE_TAG }}"
                  echo "Construyendo imagen con tag: $IMAGE_TAG"
                  docker build -t "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:$IMAGE_TAG" .
                  docker push "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:$IMAGE_TAG"

    # Etapa 4 - Pruebas unitarias
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        needs: build
        environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'noprod' }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run tests
              run: pytest test_app.py -v

    # Etapa 5 - Deploy al Container App
    deploy:
        name: Deploy to Container App
        runs-on: ubuntu-latest
        needs: [versioning, build, test]
        environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'noprod' }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Azure Login
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Update Container App image
              run: |
                  IMAGE_TAG="${{ needs.versioning.outputs.IMAGE_TAG }}"
                  echo "Desplegando imagen con tag: $IMAGE_TAG"
                  az extension add --name containerapp --upgrade
                  az containerapp update \
                    --name "${{ env.CONTAINERAPP_NAME }}" \
                    --resource-group "${{ env.RESOURCE_GROUP }}" \
                    --image "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:$IMAGE_TAG"